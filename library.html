<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Library · FullPageCapture</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="library.css">
</head>
<body class="library-page">
  <main class="library-app">
    <header class="page-header">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h4v14H4zM10 4h4v15.5h-4zM16 6h4v13.5h-4z"/></svg></div>
      <div class="brand-copy"><h1>Capture Library</h1><p>Your saved captures, stored on this device</p></div>
      <button id="settings" class="page-icon-button" type="button" aria-label="Open settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6M14 7h6M4 17h2M10 17h10" /><circle cx="12" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg></button>
    </header>
    <section class="library-control">
      <div><h2>Save captures to Library</h2><p id="toggle-description">Loading Library settings…</p></div>
      <label class="switch" aria-label="Enable Capture Library"><input id="library-enabled" type="checkbox"><span></span></label>
    </section>
    <div id="status" class="library-status" role="status" aria-live="polite"></div>
    <section id="captures" class="library-grid" aria-label="Saved captures"></section>
  </main>
  <script src="library.js"></script>
</body>
</html>
