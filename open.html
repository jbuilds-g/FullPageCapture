<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved capture · FullPageCapture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    #preview { position: fixed; inset: 0; width: 100%; height: 100%; }
    .preview { display: block; width: 100%; height: 100%; border: 0; }
    img.preview { object-fit: contain; background: #111; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: white; background: #111; font: 14px system-ui, sans-serif; text-align: center; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="preview"></div>
  <div id="status" role="status" aria-live="polite">Opening saved capture…</div>
  <script src="open.js"></script>
</body>
</html>
